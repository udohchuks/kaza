<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Training and inference</title>
<link rel="stylesheet" href="style.css">
<style>@page { size: 1080px 1060px; }</style>
</head>
<body>
<div id="fig"></div>
<script src="fig.js"></script>
<script>
const W = 1080, H = 1060;
const p = [];
p.push(header("Training and inference", "How the parts connect in each mode. Phase 1: the user frame is omitted (adds 0)."));

// Column titles and divider.
p.push(label(40, 182, ["Training"], { size: 28 }));
p.push(text(40, 208, "whole clip at once, teacher forcing", { size: 17, weight: 600, fill: "#666", anchor: "start" }));
p.push(label(560, 182, ["Inference"], { size: 28 }));
p.push(text(560, 208, "one 80 ms step at a time", { size: 17, weight: 600, fill: "#666", anchor: "start" }));
p.push(leader([[540, 160], [540, 975]]));

// ================= Training =================
p.push(box(120, 230, 300, 46, "Audio clips, 24 kHz", null, "white"));
p.push(arrow([[270, 276], [270, 304]]));
p.push(box(120, 306, 300, 46, "Codec encoder", "frozen · run once, offline", "frozen"));
p.push(arrow([[270, 352], [270, 380]]));
p.push(box(120, 382, 300, 46, "Token files on disk", "12 tokens per 80 ms frame", "white"));
p.push(arrow([[270, 428], [270, 468]]));
p.push(box(120, 470, 300, 56, "Inputs for frame t", "user t · agent t−1 (5–10% corrupt in scaled)", "white"));
p.push(arrow([[270, 526], [270, 554]]));
p.push(box(120, 556, 300, 40, "Embed and sum → 2,048", null, "purple"));
p.push(arrow([[270, 596], [270, 624]]));
p.push(box(120, 626, 300, 56, "LFM3-1.7B-Base + 6 new", "all frames at once, causal mask", "purple"));
p.push(arrow([[270, 682], [270, 728]]));
p.push(box(120, 730, 300, 56, "Depth decoder (MaskGIT)", "context; random tokens hidden", "teal"));
p.push(arrow([[270, 786], [270, 828]]));
p.push(box(120, 830, 300, 56, "Audio loss", "vs true 12 tokens (+ MTP t+2, t+4 in scaled)", "coral"));
p.push(text(40, 925, "Overfit test: pure audio loss (no MTP or corruption).", { size: 14, fill: "#555", anchor: "start" }));
p.push(text(40, 947, "Codec decoder: not used in training.", { size: 14, fill: "#555", anchor: "start" }));

// ================= Inference =================
p.push(box(620, 230, 300, 46, "Microphone", "user speech, live", "white"));
p.push(arrow([[770, 276], [770, 304]]));
p.push(box(620, 306, 300, 46, "Streaming codec encoder", "frozen · waits 20 ms look-ahead", "frozen"));
p.push(arrow([[770, 352], [770, 380]]));
p.push(box(620, 382, 300, 46, "User tokens", "12 per 80 ms frame", "white"));
p.push(arrow([[770, 428], [770, 468]]));
p.push(box(620, 470, 300, 56, "Inputs for step t", "user t · agent t−1", "white"));
p.push(arrow([[770, 526], [770, 554]]));
p.push(box(620, 556, 300, 40, "Embed and sum → 2,048", null, "purple"));
p.push(arrow([[770, 596], [770, 624]]));
p.push(box(620, 626, 300, 56, "LFM3-1.7B-Base + 6 new", "one step, KV/conv cache for the past", "purple"));
p.push(arrow([[770, 682], [770, 728]]));
p.push(box(620, 730, 300, 56, "Depth decoder (MaskGIT)", "context; 3 passes × 4 tokens", "teal"));
p.push(arrow([[770, 786], [770, 828]]));
p.push(box(620, 830, 300, 56, "Codec decoder", "frozen · streaming, holds back 40 ms", "frozen"));
p.push(arrow([[770, 886], [770, 918]]));
p.push(box(620, 920, 300, 46, "Speaker", "80 ms of agent voice", "white"));

// Feedback to the next step.
p.push(arrow([[920, 758], [1035, 758], [1035, 498], [922, 498]], { dash: "6 4", color: "#1f7a71" }));
p.push(text(980, 488, "agent 12 tokens", { size: 12, fill: "#1f7a71" }));
p.push(text(980, 514, "next step", { size: 12, fill: "#1f7a71" }));

// Legend.
const legend = [["white", "Data"], ["frozen", "Frozen codec"], ["purple", "Trained"], ["teal", "Depth decoder (trained)"], ["coral", "Training only"]];
let lx = 70;
legend.forEach(([s, t]) => {
  const st = STYLE[s];
  p.push(`<rect x="${lx}" y="1004" width="26" height="16" rx="4" fill="${st.fill}" stroke="${st.stroke === "none" ? st.fill : st.stroke}"/>`);
  p.push(text(lx + 34, 1017, t, { size: 14, anchor: "start" }));
  lx += 34 + t.length * 7.6 + 40;
});
p.push(text(860, 1017, "dashed = fed back next step", { size: 14, anchor: "start", fill: "#555" }));

draw(W, H, p);
</script>
</body>
</html>
